apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: vault-operator
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: vault-operator
      sourceRef:
        kind: HelmRepository
        name: vault-operator
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    tolerations:
      - key: environment
        operator: Equal
        value: infra
        effect: NoSchedule
