---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: trust-manager
spec:
  interval: 1m
  chart:
    spec:
      chart: trust-manager
      version: 0.7.0
      sourceRef:
        kind: HelmRepository
        name: ctrust-manager
  # valuesFrom:
  #   - kind: ConfigMap
  #     name: cert-manager-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5