---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: linkerd-crds
spec:
  interval: 10m
  chart:
    spec:
      chart: linkerd-crds
      version: 1.8.0
      sourceRef:
        kind: HelmRepository
        name: linkerd-crds
  valuesFrom:
    - kind: ConfigMap
      name: linkerd-crds-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5