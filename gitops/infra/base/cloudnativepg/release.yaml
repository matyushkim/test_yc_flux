apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 10m
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
  valuesFrom:
    - kind: ConfigMap
      name: cloudnative-pg-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5