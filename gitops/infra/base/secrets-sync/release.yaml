apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kubernetes-replicator
spec:
  interval: 10m
  chart:
    spec:
      chart: kubernetes-replicator
      version: 2.9.1
      sourceRef:
        kind: HelmRepository
        name: mittwald
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    tolerations:
      - key: environment
        operator: Equal
        value: infra
        effect: NoSchedule