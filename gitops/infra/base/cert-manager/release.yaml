---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1m
  chart:
    spec:
      chart: cert-manager
      version: v1.13.1
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  # valuesFrom:
  #   - kind: ConfigMap
  #     name: cert-manager-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
      