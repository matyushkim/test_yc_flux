apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: weave-gitops
spec:
  interval: 1m0s
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    adminUser:
      create: true
      passwordHash: $2a$12$/90yfwPUmWmxknSo/rlnW.c3n/JHm0ZFCRV1ny1L6g70hpxPwJTRq
      username: "admin"
    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # external-dns.alpha.kubernetes.io/hostname: wo.infra.matyshkinm.evrone.app
    #     # Authentication
    #     nginx.ingress.kubernetes.io/auth-url: ----
    #     nginx.ingress.kubernetes.io/auth-signin: ---
      tls:
        - hosts:
          - wo.infra.matyshkinm.evrone.app
          secretName: matyshkin-com-wildcard-tls
      hosts:
      - host: wo.infra.matyshkinm.evrone.app
        paths:
          - path: /
            pathType: ImplementationSpecific
    # tolerations:
    #   - key: environment
    #     operator: Equal
    #     value: infra
    #     effect: NoSchedule 
