---
admin:
  existingSecret: grafana-admin

tolerations:
  - key: environment
    operator: Equal
    value: infra
    effect: NoSchedule

persistence:
  enabled: false


ingress:
  enabled: true
  annotations: 
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
  path: /
  pathType: Prefix
  hosts:
      - grafana.infra.matyshkinm.evrone.app
  tls: 
   -   secretName: matyshkin-com-grafana-tls
       hosts:
       - grafana.infra.matyshkinm.evrone.app

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki:3100
        jsonData:
          maxLines: 1000
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.prometheus:9090
        jsonData:
          maxLines: 1000

dashboards:
  default:
    node-stats:
      gnetId: 1860
      revision: 33
      datasource: Prometheus
      
sidecar:
  dashboards:
    enabled: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

service:
  annotations:
    linkerd.io/inject: enabled

alerting:
  rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: '{{ .Chart.Name }}_my_rule_group'
          folder: my_first_folder
          interval: 60s
          rules:
            - uid: my_id_1
              title: my_first_rule
              condition: A
              data:
                - refId: A
                  datasourceUid: '-100'
                  model:
                    conditions:
                    - alert: Alert
                      expr: sum(rate(nginx_ingress_controller_requests{status=~'5..'}[1m])) by (ingress,cluster) / sum(rate(nginx_ingress_controller_requests[1m]))by (ingress) * 100 > 5
                      for: 1m
              annotations:
                description: "{{ $labels.ingress }} has an error rate of {{ $value }}%. Expected less than 5%."
              labels:
                severity: warning
