---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: 7.0.3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: grafana
  valuesFrom:
    - kind: ConfigMap
      name: grafana-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5