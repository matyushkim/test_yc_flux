apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  - namespace.yaml
  - secret.yaml
  - repository.yaml
  - release.yaml
  - grafana-dashboard.json
configMapGenerator:
  - name: grafana-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml