apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
commonLabels:
  grafana_dashboards: "1"
configMapGenerator:
  - name: grafana-dashboard
    files:
      - grafana-dashboard.json

