alertmanager:
  enabled: false

mimir:
  structuredConfig:
    admin_client:
      storage:
        s3:
      endpoint   : "storage.yandexcloud.net"
      region     : "ru-central1"
    alertmanager_storage:
      s3:
      bucket_name: "evronelabs-victoriametrics-store"
    blocks_storage:
      backend: s3
      s3:
      bucket_name: "evronelabs-victoriametrics-store"
    ruler_storage:
      s3:
      bucket_name: "evronelabs-victoriametrics-store"

global:
  extraEnvFrom:
    - secretRef:
        name: aws-credentials
  podAnnotations:
    bucketSecretVersion: "0"

minio:
  enabled: false

compactor:
  persistentVolume:
    size: 5Gi
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 1
      memory: 128Mi

distributor:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 2
      memory: 128Mi

ingester:
  persistentVolume:
    size: 256Mi
  replicas: 2
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 2
      memory: 128Mi
  topologySpreadConstraints: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: target # support for enterprise.legacyLabels
                operator: In
                values:
                  - ingester
          topologyKey: 'kubernetes.io/hostname'

        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - ingester
          topologyKey: 'kubernetes.io/hostname'
  zoneAwareReplication:
        enabled: false

admin-cache:
  enabled: false
  replicas: 2

chunks-cache:
  enabled: false
  replicas: 2

index-cache:
  enabled: false
  replicas: 3

metadata-cache:
  enabled: false

results-cache:
  enabled: false
  replicas: 2

overrides_exporter:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

querier:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 2
      memory: 128Mi

query_frontend:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 2
      memory: 128Mi

ruler:
  replicas: 1
  resources:
    limits:
      memory: 12Mi
    requests:
      cpu: 1
      memory: 12Mi

store_gateway:
  persistentVolume:
    size: 1Gi
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 1
      memory: 128Mi
  topologySpreadConstraints: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: target # support for enterprise.legacyLabels
                operator: In
                values:
                  - store-gateway
          topologyKey: 'kubernetes.io/hostname'

        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - store-gateway
          topologyKey: 'kubernetes.io/hostname'
  zoneAwareReplication:
        enabled: false
