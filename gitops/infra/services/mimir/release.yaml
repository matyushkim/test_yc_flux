---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mimir
spec:
  interval: 10m
  chart:
    spec:
      chart: mimir-distributed
      version: 5.2.0-weekly.261
      sourceRef:
        kind: HelmRepository
        name: mimir
        namespace: mimir
  valuesFrom:
    - kind: ConfigMap
      name: mimir-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5