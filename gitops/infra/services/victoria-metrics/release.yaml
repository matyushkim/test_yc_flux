---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  interval: 10m
  chart:
    spec:
      chart: victoria-metrics-cluster
      version: 0.11.4
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: victoria-metrics
  valuesFrom:
    - kind: ConfigMap
      name: victoria-metrics-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5