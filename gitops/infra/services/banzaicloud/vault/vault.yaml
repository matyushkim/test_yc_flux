apiVersion: "vault.banzaicloud.com/v1alpha1"
kind: Vault
metadata:
  name: vault
spec:
  vaultAnnotations:
    linkerd.io/inject: enabled
  size: 1
  image: hashicorp/vault:latest
  # bankVaultsImage: banzaicloud/bank-vaults:latest

  # Specify the ServiceAccount where the Vault Pod and the Bank-Vaults configurer/unsealer is running
  serviceAccount: vault

  # Define a list of namespaces or use ["*"] for all namespaces.
  caNamespaces:
    - "*"

  vaultPodSpec: &podSpec
    tolerations:
      - key: environment
        operator: Equal
        value: infra
        effect: NoSchedule

  vaultConfigurerPodSpec: *podSpec

  # Describe where you would like to store the Vault unseal keys and root token.
  # Describe where you would like to store the Vault unseal keys and root token.
  unsealConfig:
    options:
      # The preFlightChecks flag enables unseal and root token storage tests
      # This is true by default
      preFlightChecks: true
      # The storeRootToken flag enables storing of root token in chosen storage
      # This is true by default
      storeRootToken: true
    kubernetes:
      secretNamespace: vault

  # A YAML representation of a final vault config file, this config represents
  # a backend config in AWS.
  # See https://www.vaultproject.io/docs/configuration/ for more information.
  config:
    storage:
      s3:
        region    : "ru-cenrtal1"
        bucket    : "evronelabs-vault-key-store"
        endpoint  : "storage.yandexcloud.net"
    listener:
      tcp:
        address       : "0.0.0.0:8200"
        tls_cert_file : /vault/tls/server.crt
        tls_key_file  : /vault/tls/server.key
    api_addr: https://vault.vault:8200
    telemetry:
      statsd_address: localhost:9125
    ui: true

  vaultEnvsConfig:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: vault-aws
          key : AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: vault-aws
          key : AWS_SECRET_ACCESS_KEY

  # See: https://banzaicloud.com/docs/bank-vaults/cli-tool/#example-external-vault-configuration
  # The repository also contains a lot examples in the test/deploy and operator/deploy directories.
  externalConfig:
    policies:
      - name: allow_secrets
        rules: | 
          path "secret/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "development/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "production/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "fluxcd/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      - name: allow_pki
        rules: |
          path "pki/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      - name: allow_dev
        rules: | 
          path "development/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      - name: allow_admin
        rules: | 
          path "development/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "production/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "fluxcd/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
      # - name: mat
      #   rules: | 
      #     path "fluxcd/*" {
      #       capabilities = ["create", "read", "update", "delete", "list"]
      
      
    auth:
      - type: kubernetes
        roles:
          # Allow every pod in the default namespace to use the secret kv store
          - name: default
            bound_service_account_names: "*"
            bound_service_account_namespaces: "*"
            policies: ["allow_secrets", "allow_pki"]
            ttl: 1h

          # Allow mutation of secrets using secrets-mutation annotation to use the secret kv store
          - name: secretsmutation
            bound_service_account_names: "*"
            bound_service_account_namespaces: "*"
            policies:
              - allow_secrets
            ttl: 1h
      - type: userpass
        roles:
          - name: admins
            bound_service_account_names: "*"
            bound_service_account_namespaces: "*"
            policies:
              - allow_admin
            ttl: 1h
          - name: default
            bound_service_account_names: "*"
            bound_service_account_namespaces: "*"
            policies:
              - allow_dev
            ttl: 1h
      # - type: userpass
      #   roles:
      #     - name: admin
      #       user: mat-test
      #       password: "123"
      #       policies:
      #           - mat
      #       ttl: 1h
           
      

    secrets:
      - path: secret
        type: kv
        description: General secrets.
        options:
          version: 2
      - path: development
        type: kv
        description: General secrets.
        options:
          version: 2
      - path: production
        type: kv
        description: General secrets.
        options:
          version: 2
      - path: fluxcd
        type: kv
        description: General secrets.
        options:
          version: 2

      - path: pki
        type: pki
        description: Vault PKI Backend
        config:
          default_lease_ttl: 168h
          max_lease_ttl: 720h
        configuration:
          config:
          - name: urls
            issuing_certificates: https://vault.vault:8200/v1/pki/ca
            crl_distribution_points: https://vault.vault:8200/v1/pki/crl
          root/generate:
          - name: internal
            common_name: vault.vault
          roles:
          - name: default
            allowed_domains: localhost,pod,svc,default
            allow_subdomains: true
            generate_lease: true
            ttl: 1m

  # If you are not using IAM instance profiles to authenticate against AWS you can pass in an
  # AWS credentials refering to a Secret with the following configuration block. You have to
  # create the "aws-cred" secret manually, it has to have a key called "credentials" holding
  # the configuration in the following format:
  # https://docs.aws.amazon.com/cli/latest/topic/config-vars.html#the-shared-credentials-file
  # credentialsConfig:
  #   env: AWS_SHARED_CREDENTIALS_FILE
  #   path: /etc/aws/credentials
  #   secretName: aws-cred

  # Or you can follow: https://banzaicloud.com/docs/bank-vaults/cloud-permissions/#aws
  # to give access to AWS S3 and KMS on an EKS cluster (recommended).