apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkerd
resources:
  - repository.yaml
  - release.yaml
  - issuer.yaml
  - cert.yaml
  - secret.yaml
configMapGenerator:
  - name: linkerd-control-plane-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml