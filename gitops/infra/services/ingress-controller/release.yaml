---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: nginx-ingress-controller
spec:
  interval: 10m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.8.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-controller
  valuesFrom:
    - kind: ConfigMap
      name: ingress-controller-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5