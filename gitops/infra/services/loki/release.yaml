---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 10m
  chart:
    spec:
      chart: loki-stack
      version: 2.9.11
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: loki
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5