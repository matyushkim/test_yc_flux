---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: linkerd-control-plane
spec:
  interval: 10m
  chart:
    spec:
      chart: linkerd-control-plane
      version: 1.16.3
      sourceRef:
        kind: HelmRepository
        name: linkerd-control-plane
  # valuesFrom:
  #   - kind: ConfigMap
  #     name: linkerd-control-plane-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5