global:
  imagePullSecrets:
    - name:  aws-credentials

prometheus:
  prometheusSpec:
    thanos:
      secret:
        type: s3
        config:
          endpoint    : "storage.yandexcloud.net"
          bucketnames : "evronelabs-prometheus-store"
          region      : "ru-central1"

grafana:
  enabled: false




