grafana:
  enabled: false


alertmanager:
  templateFiles:
    template_1.tmpl: |-
          {{ define "slack.text" }}
          {{- $root := . -}}
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:>
            *Runbook:* <{{ .Annotations.runbook }}|:spiral_note_pad:>
            *Details:*
              {{ range .Labels.SortedPairs }} - *{{ .Name }}:* `{{ .Value }}`
              {{ end }}
          {{ end }}
          {{ end }}
  config: 
    receivers:
     - name: telegram-test
       telegram_configs:
        - chat_id: -4054758218
          bot_token: 6924031733:AAFHyuMMY7xEDLLcQ0CP0sF4T4kIj608oq4
          api_url: "https://api.telegram.org"
          send_resolved: true
          parse_mode: HTML
          message: '{{ template "slack.text" . }}'

    route:
        group_by: ['ds_id'] # Алерты группируются по UUID кластера.
        group_wait: 15s
        group_interval: 30s
        repeat_interval: 12h
        receiver: telegram-test
        routes:
          - receiver: telegram-test
            continue: true
            matchers:
            - notification="telegram"