#           key: object-store.yaml
#     tolerations:
#       - key: environment
#         operator: Equal
#         value: infra
#         effect: NoSchedule
alertmanager:
  alertmanagerSpec:
    tolerations:
      - key: environment
        operator: Equal
        value: infra
        effect: NoSchedule
prometheusOperator:
  tolerations:
    - key: environment
      operator: Equal
      value: infra
      effect: NoSchedule
  admissionWebhooks:
    patch:
      tolerations:
        - key: environment
          operator: Equal
          value: infra
          effect: NoSchedule
thanosRuler:
  thanosRulerSpec:
    tolerations:
      - key: environment
        operator: Equal
        value: infra
        effect: NoSchedule
