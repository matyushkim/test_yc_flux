---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: prometheus
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 52.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: prometheus
  valuesFrom:
    - kind: ConfigMap
      name: prometheus-values
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5