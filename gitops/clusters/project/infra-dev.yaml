---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: development-apps
  namespace: flux-system
spec:
  interval: 1m0s
  url: ssh://git@github.com/matyushkim/test_yc_argo.git
  secretRef:
    name: flux-system
  ref:
    branch: main
  ignore: |
    # exclude all
    /*
    # include gitops directory
    !/gitops/infra/services
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: development-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./gitops/apps/
  prune: true
  sourceRef:
    kind: GitRepository
    name: development-apps
  postBuild:
    substitute:
      tenant_environment: development
      tenant_domain: dev.berealfan.com
      tenant_toleration: dev